name: python

# Owner decision 2026-11-04 (CI): while the repository is private, pull
# requests run on Linux only (Python 3.11-3.13) and macOS runs Python 3.13 on
# pushes to main, weekly and on demand (macOS runner capacity). Once the
# repository is public, pull requests run the full macOS matrix too. Only the
# three Linux jobs are required checks for main (owner decision 2026-11-10):
# macOS runs are informative, so runner-capacity cancellations never block a
# merge. The switch is automatic:
# github.event.repository.private is false in the event payload. Scheduled
# runs carry no repository object and keep the private setting.

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "spec/**"
      - "LICENSE"
      - ".github/workflows/python.yml"
      - ".github/actions/python-checks/**"
  # No path filter on pull requests: required checks must report on every
  # pull request, or a pull request that touches no Python file could never
  # be merged.
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / Python ${{ matrix.python-version }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-checks
        with:
          python-version: ${{ matrix.python-version }}

  macos:
    # Linux and macOS are the v0.1 platforms (owner decision Q8).
    name: macOS / Python ${{ matrix.python-version }}
    if: github.event_name != 'pull_request' || github.event.repository.private == false
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event.repository.private == false && '["3.11", "3.12", "3.13"]' || '["3.13"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-checks
        with:
          python-version: ${{ matrix.python-version }}
