name: python

# Owner decision 2026-11-04 (private repository, macOS runner capacity):
# pull requests run on Linux only, Python 3.11-3.13; macOS runs one Python
# version on pushes to main and once a week, and does not block pull
# requests. Task 23 restores the full macOS matrix on pull requests when the
# repository becomes public.

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "spec/**"
      - "LICENSE"
      - ".github/workflows/python.yml"
      - ".github/actions/python-checks/**"
  pull_request:
    paths:
      - "python/**"
      - "spec/**"
      - "LICENSE"
      - ".github/workflows/python.yml"
      - ".github/actions/python-checks/**"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / Python ${{ matrix.python-version }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-checks
        with:
          python-version: ${{ matrix.python-version }}

  macos:
    # Linux and macOS are the v0.1 platforms (owner decision Q8).
    name: macOS / Python 3.13
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-checks
        with:
          python-version: "3.13"
