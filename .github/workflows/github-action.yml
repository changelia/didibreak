name: github-action

# Self-test of the composite action in github-action/ (task 32). It runs the
# action on this repository's pull requests with --cases-file, so it needs no
# API key and no repository secret. The job makes its own change first:
# prices_changed.txt replaces selftest/prices.py (the minus sign is lost, and
# one input returns hostile text), and a job-local pyproject.toml excludes the
# other Python files, so max_functions can never cut the fixture. The job
# fails unless the fixture was checked and produced that finding (owner
# decision 2026-11-24). The no-key job is the path pull requests from forks
# take.

on:
  pull_request:
    paths:
      - "github-action/**"
      - ".github/workflows/github-action.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  cases-file:
    name: Action / cases file / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Make the fixture change
        shell: bash
        run: |
          cp github-action/selftest/prices_changed.txt github-action/selftest/prices.py
          cat > pyproject.toml <<'TOML'
          [tool.didibreak]
          exclude = ["python/", "github-action/didibreak_action.py", "github-action/selftest/check_report.py"]
          TOML
      - id: didibreak
        uses: ./github-action
        with:
          cases-file: github-action/selftest/cases.json
          comment: ${{ matrix.os == 'ubuntu-latest' }}
          artifact-name: didibreak-report-${{ matrix.os }}
      - name: Check the outputs
        shell: bash
        env:
          DECISION: ${{ steps.didibreak.outputs.decision }}
          EXIT_CODE: ${{ steps.didibreak.outputs.exit-code }}
          UNEXPECTED: ${{ steps.didibreak.outputs.unexpected }}
          UNCLEAR: ${{ steps.didibreak.outputs.unclear }}
        run: |
          echo "decision=$DECISION exit-code=$EXIT_CODE unexpected=$UNEXPECTED unclear=$UNCLEAR"
          test "$DECISION" = run
          test "$EXIT_CODE" = 0
          test "$UNCLEAR" -ge 1
      - name: Check that the fixture was checked and found
        shell: bash
        env:
          REPORT: ${{ steps.didibreak.outputs.report }}
        run: python3 github-action/selftest/check_report.py "$REPORT"
      - name: Check that the comment renders no links, images or mentions
        if: matrix.os == 'ubuntu-latest' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github.html+json" --paginate \
            "repos/$REPOSITORY/issues/$NUMBER/comments" \
            --jq '.[] | select(.user.type == "Bot" and (.body | startswith("<!-- didibreak-action-comment -->"))) | .body_html' > comment.html
          test -s comment.html
          if grep -E '<a |<img|user-mention' comment.html; then
            echo "self-test: the comment renders markup from untrusted text"
            exit 1
          fi
          grep -q 'img src=x' comment.html

  no-key:
    name: Action / no API key (fork pull requests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: didibreak
        uses: ./github-action
        with:
          api-key: ""
      - name: Check that the run was skipped
        shell: bash
        env:
          DECISION: ${{ steps.didibreak.outputs.decision }}
        run: test "$DECISION" = skip
