[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "didibreak"
dynamic = ["version"]
description = "Find unintended behavior changes in Python code by running the old and new versions side by side."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "changelia" }]
keywords = ["behavior change", "regression", "testing", "llm", "ai agents", "differential testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.28,<1",
]

[project.urls]
Homepage = "https://github.com/changelia/didibreak"
Documentation = "https://github.com/changelia/didibreak/tree/main/docs"
Changelog = "https://github.com/changelia/didibreak/blob/main/CHANGELOG.md"
Issues = "https://github.com/changelia/didibreak/issues"

[project.scripts]
didibreak = "didibreak.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "jsonschema==4.26.0",  # dev only: validates reports against spec/report.schema.json
]

[tool.ruff]
target-version = "py311"
# Fixture repositories hold sample user code, some of it deliberately
# unformatted; they are data, not project code.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# Rule set from the Code quality standards.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names describe the behavior; docstrings on each test add nothing.
"tests/**" = ["D1"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
# A test running over 5 minutes dumps every thread's stack, so a hang shows
# where it is (task 26: one unexplained 15-minute local hang).
faulthandler_timeout = 300
xfail_strict = true

[tool.hatch.version]
path = "src/didibreak/__init__.py"

[tool.hatch.build]
# Copied from the repository at build time (git-ignored) but must be packaged.
artifacts = ["src/didibreak/prompts/", "/LICENSE"]

[tool.hatch.metadata.hooks.custom]
# hatch_build.py: copies the root LICENSE to python/LICENSE.

[tool.hatch.build.hooks.custom]
# hatch_build.py: copies spec/prompts/ into src/didibreak/prompts/.

[tool.hatch.build.targets.wheel]
packages = ["src/didibreak"]

[tool.hatch.build.targets.sdist]
include = [
  "src/didibreak",
  "tests",
  "scripts",
  "hatch_build.py",
  "README.md",
  "LICENSE",
]
