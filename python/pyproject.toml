[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "didibreak"
dynamic = ["version"]
description = "Find unintended behavior changes in Python code by running the old and new versions side by side."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
didibreak = "didibreak.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.ruff]
target-version = "py311"
# Fixture repositories hold sample user code, some of it deliberately
# unformatted; they are data, not project code.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# Rule set from the Code quality standards.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names describe the behavior; docstrings on each test add nothing.
"tests/**" = ["D1"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.hatch.version]
path = "src/didibreak/__init__.py"

[tool.hatch.build]
# Copied from the repository at build time (git-ignored) but must be packaged.
artifacts = ["src/didibreak/prompts/", "/LICENSE"]

[tool.hatch.metadata.hooks.custom]
# hatch_build.py: copies the root LICENSE to python/LICENSE.

[tool.hatch.build.hooks.custom]
# hatch_build.py: copies spec/prompts/ into src/didibreak/prompts/.

[tool.hatch.build.targets.wheel]
packages = ["src/didibreak"]

[tool.hatch.build.targets.sdist]
include = [
  "src/didibreak",
  "tests",
  "scripts",
  "hatch_build.py",
  "README.md",
  "LICENSE",
]
